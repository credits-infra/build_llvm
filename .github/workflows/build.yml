name: Build & upload toolchain for Apple Container
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        bash ci.sh deps
        sudo apt-get install -y patchelf
    - name: Build LLVM
      run: bash ./build-toolchain.sh
    - name: Package toolchain
      run: |
        # Get build info
        DATE=$(date +%Y%m%d)
        if [ -f ./install/bin/clang ]; then
          CLANG_VERSION=$("./install/bin/clang" --version | head -n1 | cut -d' ' -f3)
        else
          CLANG_VERSION="unknown"
        fi

        # Auto-generate a unique tag: date + run number + re-run attempt, so
        # every run (including re-runs of the same run) gets its own release
        BUILD_TAG=${DATE}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}

        # Create tarball
        tar -czf clang-toolchain-${BUILD_TAG}.tar.gz -C install .

        # Save build info to global env variable
        echo "CLANG_VERSION=${CLANG_VERSION}" >> $GITHUB_ENV
        echo "BUILD_TAG=${BUILD_TAG}" >> $GITHUB_ENV
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.BUILD_TAG }}
        target_commitish: container
        name: "Toolchain Build ${{ env.BUILD_TAG }}"
        body: |
          Automated build of LLVM + Clang ${{ env.CLANG_VERSION }}.

          This release contains a prebuilt Clang toolchain with AArch64, ARM, and X86 targets.
        files: clang-toolchain-${{ env.BUILD_TAG }}.tar.gz
        draft: false
        prerelease: false
        allowUpdates: true
        overwrite_files: true